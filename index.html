<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Mastery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        canvas { background: #0c0b0a; border-radius: 8px; max-width: 100%; margin: 1rem auto; display: block; border: 1px solid #2d2925; }
        .graph-note { color: #8f857c; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo"><img src="logo.jpg" alt="Logo" class="logo-img"><h1>Algebra<br>Mastery</h1></div>
        <div class="player-stats">
            <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="lvl">1</span></div>
            <div class="stat"><span class="stat-label">XP</span><span class="stat-value" id="xp">0</span></div>
            <div class="stat"><span class="stat-label">Streak</span><span class="stat-value" id="streak">0 🔥</span></div>
        </div>
        <nav>
            <button class="nav-btn active" onclick="go('dashboard')">🏠 Dashboard</button>
            <button class="nav-btn" onclick="go('linear')">⚖️ Linear</button>
            <button class="nav-btn" onclick="go('systems')">🔗 Systems</button>
            <button class="nav-btn" onclick="go('quadratic')">📈 Quadratic</button>
            <button class="nav-btn" onclick="go('polynomials')">🧩 Polynomials</button>
            <button class="nav-btn" onclick="go('exponents')">⚡ Exponents</button>
            <button class="nav-btn" onclick="go('rational')">➗ Rational</button>
            <button class="nav-btn" onclick="go('graphtest')">📊 Graph Test</button>
            <button class="nav-btn" onclick="go('tools')">🛠️ Tools</button>
        </nav>
    </aside>
    <main class="main" id="main"></main>
</div>
<script>
let xp=0,level=1,streak=0,problem=null;
function renderMath(el){if(window.renderMathInElement&&el)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});}
function go(section){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(event&&event.target)event.target.classList.add('active');document.getElementById('main').innerHTML=content[section]();renderMath(document.getElementById('main'));setTimeout(()=>{if(section==='linear')newLin();if(section==='quadratic')newQuad();if(section==='systems')newSys();if(section==='polynomials')newPoly();if(section==='exponents')newExp();if(section==='rational')newRat();if(section==='graphtest')drawTestGraph();},40);}
const content={
dashboard:()=>`<div class="section"><h2>Welcome to Algebra Mastery</h2><div class="card"><p>Practice algebra topics. Use Graph Test to verify the canvas graph is working.</p><button onclick="go('graphtest')">Open Graph Test</button><button class="secondary" onclick="go('linear')">Linear Equations</button></div><div class="card"><h3>Your Stats</h3><p>Level <strong>${level}</strong> • ${xp} XP • Streak ${streak}</p></div></div>`,
linear:()=>`<div class="section"><h2>⚖️ Linear Equations</h2><div class="card"><div id="linP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="linA" placeholder="x ="><button onclick="checkLin()">Check</button><button class="secondary" onclick="explainLin()">Explain in Long Form</button><button class="secondary" onclick="newLin()">New</button></div><div id="linF" class="feedback"></div><div id="linS" class="steps" style="display:none"></div></div></div>`,
quadratic:()=>`<div class="section"><h2>📈 Quadratic Equations</h2><div class="card"><div id="quadP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="q1" placeholder="x₁"><input type="number" step="any" id="q2" placeholder="x₂"><button onclick="checkQuad()">Check</button><button class="secondary" onclick="explainQuad()">Explain in Long Form</button><button class="secondary" onclick="newQuad()">New</button></div><div id="quadF" class="feedback"></div><div id="quadS" class="steps" style="display:none"></div></div></div>`,
systems:()=>`<div class="section"><h2>🔗 Systems of Equations</h2><div class="card"><div id="sysP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="sx" placeholder="x"><input type="number" step="any" id="sy" placeholder="y"><button onclick="checkSys()">Check</button><button class="secondary" onclick="explainSys()">Explain in Long Form</button><button class="secondary" onclick="newSys()">New</button></div><div id="sysF" class="feedback"></div><div id="sysS" class="steps" style="display:none"></div></div></div>`,
polynomials:()=>`<div class="section"><h2>🧩 Polynomials & Factoring</h2><div class="card"><div id="polyP" class="problem">Loading...</div><div class="input-group"><input type="text" id="polyA" placeholder="(x-2)(x-3)"><button onclick="checkPoly()">Check</button><button class="secondary" onclick="explainPoly()">Explain in Long Form</button><button class="secondary" onclick="newPoly()">New</button></div><div id="polyF" class="feedback"></div><div id="polyS" class="steps" style="display:none"></div></div></div>`,
exponents:()=>`<div class="section"><h2>⚡ Exponents & Radicals</h2><div class="card"><div id="expP" class="problem">Loading...</div><div class="input-group"><input type="text" id="expA" placeholder="Simplified form"><button onclick="checkExp()">Check</button><button class="secondary" onclick="explainExp()">Explain in Long Form</button><button class="secondary" onclick="newExp()">New</button></div><div id="expF" class="feedback"></div><div id="expS" class="steps" style="display:none"></div></div></div>`,
rational:()=>`<div class="section"><h2>➗ Rational Expressions</h2><div class="card"><div id="ratP" class="problem">Loading...</div><div class="input-group"><input type="text" id="ratA" placeholder="Simplified form"><button onclick="checkRat()">Check</button><button class="secondary" onclick="explainRat()">Explain in Long Form</button><button class="secondary" onclick="newRat()">New</button></div><div id="ratF" class="feedback"></div><div id="ratS" class="steps" style="display:none"></div></div></div>`,
graphtest:()=>`<div class="section"><h2>📊 Graph Test</h2><div class="card"><p>This page draws a simple test graph so we can confirm the canvas is working.</p><canvas id="testCanvas" width="500" height="300"></canvas><p class="graph-note">You should see a copper-colored line crossing the axes with a green dot at the x-intercept.</p><button onclick="drawTestGraph()">Redraw Graph</button></div></div>`,
tools:()=>`<div class="section"><h2>🛠️ Tools</h2><div class="card"><h3>Linear Solver</h3><div class="input-group"><input id="ta" type="number" value="2" style="width:70px">x + <input id="tb" type="number" value="3" style="width:70px"> = <input id="tc" type="number" value="7" style="width:70px"><button onclick="solveLin()">Solve</button></div><div id="tRes" class="steps"></div></div></div>`
};
function drawTestGraph(){const canvas=document.getElementById('testCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#8f857c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();const scale=30,cx=w/2,cy=h/2;ctx.strokeStyle='#c9895a';ctx.lineWidth=3;ctx.beginPath();for(let px=0;px<=w;px++){const x=(px-cx)/scale,y=2*x-3,py=cy-y*scale;if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();const xInt=1.5,pxInt=cx+xInt*scale;ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(pxInt,cy,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3ece4';ctx.font='14px sans-serif';ctx.fillText('x = 1.5',pxInt+10,cy-12);}
function newLin(){const a=1+Math.floor(Math.random()*5),b=Math.floor(Math.random()*13)-6,x=Math.floor(Math.random()*13)-6;problem={a,b,c:a*x+b,x};const el=document.getElementById('linP');if(el){el.innerHTML=`Solve: $${a}x ${b>=0?'+':''}${b} = ${problem.c}$`;renderMath(el);}}
function checkLin(){const ans=parseFloat(document.getElementById('linA').value);const fb=document.getElementById('linF');if(Math.abs(ans-problem.x)<0.001){fb.textContent='Correct! +15 XP';fb.className='feedback correct';addXP(15);}else{fb.textContent='Incorrect.';fb.className='feedback incorrect';streak=0;updateStats();}}
function explainLin(){const s=document.getElementById('linS');s.style.display='block';s.textContent=`LONG-FORM EXPLANATION\n\n${problem.a}x + ${problem.b} = ${problem.c}\n\nSubtract ${problem.b}: ${problem.a}x = ${problem.c-problem.b}\nDivide by ${problem.a}: x = ${problem.x}\n\nFinal Answer: x = ${problem.x}`;}
function newQuad(){const r1=1+Math.floor(Math.random()*6),r2=Math.floor(Math.random()*8)-3;problem={roots:[r1,r2].sort((a,b)=>a-b)};const b=-(r1+r2),c=r1*r2;problem.b=b;problem.c=c;const el=document.getElementById('quadP');if(el){el.innerHTML=`Solve: $x^2 ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c} = 0$`;renderMath(el);}}
function checkQuad(){const u1=parseFloat(document.getElementById('q1').value),u2=parseFloat(document.getElementById('q2').value);const roots=[u1,u2].sort((a,b)=>a-b);const ok=Math.abs(roots[0]-problem.roots[0])<0.01&&Math.abs(roots[1]-problem.roots[1])<0.01;const fb=document.getElementById('quadF');fb.textContent=ok?'Correct! +20 XP':'Not quite.';fb.className='feedback '+(ok?'correct':'incorrect');if(ok)addXP(20);else streak=0;updateStats();}
function explainQuad(){const s=document.getElementById('quadS');s.style.display='block';const [r1,r2]=problem.roots;s.textContent=`Roots: ${r1} and ${r2}\nFactored: (x-${r1})(x-${r2})=0`;}
function newSys(){const x=1+Math.floor(Math.random()*6),y=1+Math.floor(Math.random()*6);problem={x,y};const el=document.getElementById('sysP');if(el){el.innerHTML=`Solve: x+y=${x+y}, 2x-y=${2*x-y}`;}}
function checkSys(){const ux=parseFloat(document.getElementById('sx').value),uy=parseFloat(document.getElementById('sy').value);const ok=Math.abs(ux-problem.x)<0.01&&Math.abs(uy-problem.y)<0.01;const fb=document.getElementById('sysF');fb.textContent=ok?'Correct! +25 XP':'Incorrect';fb.className='feedback '+(ok?'correct':'incorrect');if(ok)addXP(25);else streak=0;updateStats();}
function explainSys(){document.getElementById('sysS').style.display='block';document.getElementById('sysS').textContent=`x=${problem.x}, y=${problem.y}`;}
function newPoly(){const r1=1+Math.floor(Math.random()*5),r2=1+Math.floor(Math.random()*5);problem={roots:[r1,r2]};const el=document.getElementById('polyP');if(el){el.innerHTML=`Factor: x² - ${r1+r2}x + ${r1*r2}`;}
function checkPoly(){const user=(document.getElementById('polyA').value||'').replace(/\s/g,'');const ok=user.includes(problem.roots[0])&&user.includes(problem.roots[1]);document.getElementById('polyF').textContent=ok?'Correct!':'Try again';document.getElementById('polyF').className='feedback '+(ok?'correct':'incorrect');if(ok)addXP(15);}
function explainPoly(){document.getElementById('polyS').style.display='block';document.getElementById('polyS').textContent=`(x-${problem.roots[0]})(x-${problem.roots[1]})`;}
function newExp(){problem={ans:['8']};document.getElementById('expP').innerHTML='Simplify: √64';}
function checkExp(){const ok=(document.getElementById('expA').value||'').includes('8');document.getElementById('expF').textContent=ok?'Correct!':'Try again';if(ok)addXP(15);}
function explainExp(){document.getElementById('expS').style.display='block';document.getElementById('expS').textContent='√64 = 8';}
function newRat(){problem={simplified:'x+2'};document.getElementById('ratP').innerHTML='Simplify: (x²-4)/(x-2)';}
function checkRat(){const ok=(document.getElementById('ratA').value||'').includes('x+2');document.getElementById('ratF').textContent=ok?'Correct!':'Factor and cancel';if(ok)addXP(15);}
function explainRat(){document.getElementById('ratS').style.display='block';document.getElementById('ratS').textContent='= x+2 (x≠2)';}
function solveLin(){const a=+document.getElementById('ta').value,b=+document.getElementById('tb').value,c=+document.getElementById('tc').value;document.getElementById('tRes').textContent=a?`x = ${((c-b)/a).toFixed(3)}`:'Invalid';}
function addXP(n){xp+=n;streak++;level=1+Math.floor(xp/100);updateStats();}
function updateStats(){document.getElementById('xp').textContent=xp;document.getElementById('lvl').textContent=level;document.getElementById('streak').textContent=streak+' 🔥';}
go('dashboard');
</script>
</body>
</html>
