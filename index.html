<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra Mastery</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
canvas { background: #0c0b0a; border-radius: 8px; max-width: 100%; margin: 1rem auto; display: block; border: 1px solid #2d2925; }
.graph-note { color: #8f857c; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><img src="logo.jpg" alt="Logo" class="logo-img"><h1>Algebra<br>Mastery</h1></div>
<div class="player-stats">
<div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="lvl">1</span></div>
<div class="stat"><span class="stat-label">XP</span><span class="stat-value" id="xp">0</span></div>
<div class="stat"><span class="stat-label">Streak</span><span class="stat-value" id="streak">0 🔥</span></div>
</div>
<nav>
<button class="nav-btn active" onclick="go('dashboard')">🏠 Dashboard</button>
<button class="nav-btn" onclick="go('linear')">⚖️ Linear</button>
<button class="nav-btn" onclick="go('systems')">🔗 Systems</button>
<button class="nav-btn" onclick="go('quadratic')">📈 Quadratic</button>
<button class="nav-btn" onclick="go('polynomials')">🧩 Polynomials</button>
<button class="nav-btn" onclick="go('exponents')">⚡ Exponents</button>
<button class="nav-btn" onclick="go('rational')">➗ Rational</button>
<button class="nav-btn" onclick="go('tools')">🛠️ Tools</button>
</nav>
</aside>
<main class="main" id="main"></main>
</div>
<script>
var xp = 0, level = 1, streak = 0, problem = null;

function renderMath(el) {
  if (window.renderMathInElement && el) {
    renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});
  }
}

function go(section) {
  var btns = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  if (event && event.target) event.target.classList.add('active');
  var main = document.getElementById('main');
  main.innerHTML = content[section]();
  renderMath(main);
  setTimeout(function() {
    if (section === 'linear') { newLin(); }
    if (section === 'quadratic') newQuad();
    if (section === 'systems') newSys();
    if (section === 'polynomials') newPoly();
    if (section === 'exponents') newExp();
    if (section === 'rational') newRat();
  }, 50);
}

var content = {
  dashboard: function() {
    return '<div class="section"><h2>Welcome to Algebra Mastery</h2><div class="card"><p>Practice algebra topics, earn XP, and build streaks. Every problem has a detailed long-form explanation.</p><button onclick="go(\'linear\')">Start with Linear Equations</button><button class="secondary" onclick="go(\'tools\')">Open Tools</button></div><div class="card"><h3>Your Stats</h3><p>Level <strong>' + level + '</strong> • ' + xp + ' XP • Streak ' + streak + '</p></div></div>';
  },
  linear: function() {
    return '<div class="section"><h2>⚖️ Linear Equations</h2><div class="card"><div id="linP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="linA" placeholder="x ="><button onclick="checkLin()">Check</button><button class="secondary" onclick="explainLin()">Explain in Long Form</button><button class="secondary" onclick="newLin()">New</button></div><div id="linF" class="feedback"></div><div id="linS" class="steps" style="display:none"></div><canvas id="linCanvas" width="500" height="280"></canvas><p class="graph-note">Graph of the line with green dot at the solution (x-intercept).</p></div></div>';
  },
  quadratic: function() {
    return '<div class="section"><h2>📈 Quadratic Equations</h2><div class="card"><div id="quadP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="q1" placeholder="x1"><input type="number" step="any" id="q2" placeholder="x2"><button onclick="checkQuad()">Check</button><button class="secondary" onclick="explainQuad()">Explain in Long Form</button><button class="secondary" onclick="newQuad()">New</button></div><div id="quadF" class="feedback"></div><div id="quadS" class="steps" style="display:none"></div></div></div>';
  },
  systems: function() {
    return '<div class="section"><h2>🔗 Systems of Equations</h2><div class="card"><div id="sysP" class="problem">Loading...</div><div class="input-group"><input type="number" step="any" id="sx" placeholder="x"><input type="number" step="any" id="sy" placeholder="y"><button onclick="checkSys()">Check</button><button class="secondary" onclick="explainSys()">Explain in Long Form</button><button class="secondary" onclick="newSys()">New</button></div><div id="sysF" class="feedback"></div><div id="sysS" class="steps" style="display:none"></div></div></div>';
  },
  polynomials: function() {
    return '<div class="section"><h2>🧩 Polynomials</h2><div class="card"><div id="polyP" class="problem">Loading...</div><div class="input-group"><input type="text" id="polyA" placeholder="(x-2)(x-3)"><button onclick="checkPoly()">Check</button><button class="secondary" onclick="explainPoly()">Explain</button><button class="secondary" onclick="newPoly()">New</button></div><div id="polyF" class="feedback"></div><div id="polyS" class="steps" style="display:none"></div></div></div>';
  },
  exponents: function() {
    return '<div class="section"><h2>⚡ Exponents</h2><div class="card"><div id="expP" class="problem">Loading...</div><div class="input-group"><input type="text" id="expA" placeholder="Answer"><button onclick="checkExp()">Check</button><button class="secondary" onclick="explainExp()">Explain</button><button class="secondary" onclick="newExp()">New</button></div><div id="expF" class="feedback"></div><div id="expS" class="steps" style="display:none"></div></div></div>';
  },
  rational: function() {
    return '<div class="section"><h2>➗ Rational</h2><div class="card"><div id="ratP" class="problem">Loading...</div><div class="input-group"><input type="text" id="ratA" placeholder="Simplified"><button onclick="checkRat()">Check</button><button class="secondary" onclick="explainRat()">Explain</button><button class="secondary" onclick="newRat()">New</button></div><div id="ratF" class="feedback"></div><div id="ratS" class="steps" style="display:none"></div></div></div>';
  },
  tools: function() {
    return '<div class="section"><h2>🛠️ Tools</h2><div class="card"><h3>Linear Solver</h3><div class="input-group"><input id="ta" type="number" value="2" style="width:70px">x + <input id="tb" type="number" value="3" style="width:70px"> = <input id="tc" type="number" value="7" style="width:70px"><button onclick="solveLin()">Solve</button></div><div id="tRes" class="steps"></div></div></div>';
  }
};

function drawLinGraph(showAnswer) {
  var canvas = document.getElementById('linCanvas');
  if (!canvas || !problem) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#8f857c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
  ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h);
  ctx.stroke();
  var scale = 25, cx = w/2, cy = h/2;
  var a = problem.a, b = problem.b, c = problem.c;
  ctx.strokeStyle = '#c9895a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  var started = false;
  for (var px = 0; px <= w; px++) {
    var x = (px - cx) / scale;
    var y = c - a * x - b;
    var py = cy - y * scale;
    if (py > -50 && py < h + 50) {
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
  }
  ctx.stroke();
  // Only show the solution dot and label after the user answers correctly
  if (showAnswer) {
    var xInt = problem.x;
    var pxInt = cx + xInt * scale;
    if (pxInt >= 0 && pxInt <= w) {
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(pxInt, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f3ece4';
      ctx.font = '13px sans-serif';
      ctx.fillText('x = ' + xInt, pxInt + 10, cy - 10);
    }
  }
}

function newLin() {
  var a = 1 + Math.floor(Math.random() * 5);
  var b = Math.floor(Math.random() * 13) - 6;
  var x = Math.floor(Math.random() * 13) - 6;
  problem = {a: a, b: b, c: a * x + b, x: x};
  var el = document.getElementById('linP');
  if (el) { el.innerHTML = 'Solve: $' + a + 'x ' + (b >= 0 ? '+' : '') + b + ' = ' + problem.c + '$'; renderMath(el); }
  setTimeout(function() { drawLinGraph(false); }, 30);
}
function checkLin() {
  var ans = parseFloat(document.getElementById('linA').value);
  var fb = document.getElementById('linF');
  if (Math.abs(ans - problem.x) < 0.001) {
    fb.textContent = 'Correct! +15 XP';
    fb.className = 'feedback correct';
    addXP(15);
    drawLinGraph(true);
  } else {
    fb.textContent = 'Incorrect.';
    fb.className = 'feedback incorrect';
    streak = 0;
    updateStats();
    drawLinGraph(false);
  }
}
function explainLin() {
  var s = document.getElementById('linS');
  s.style.display = 'block';
  s.textContent = 'LONG-FORM EXPLANATION\n\n' + problem.a + 'x + ' + problem.b + ' = ' + problem.c + '\n\nSubtract ' + problem.b + ': ' + problem.a + 'x = ' + (problem.c - problem.b) + '\nDivide by ' + problem.a + ': x = ' + problem.x + '\n\nFinal Answer: x = ' + problem.x;
}

function newQuad() {
  var r1 = 1 + Math.floor(Math.random() * 6);
  var r2 = Math.floor(Math.random() * 8) - 3;
  problem = {roots: [r1, r2].sort(function(a,b){return a-b;})};
  var b = -(r1 + r2), c = r1 * r2;
  problem.b = b; problem.c = c;
  var el = document.getElementById('quadP');
  if (el) { el.innerHTML = 'Solve: $x^2 ' + (b>=0?'+':'') + b + 'x ' + (c>=0?'+':'') + c + ' = 0$'; renderMath(el); }
}
function checkQuad() {
  var u1 = parseFloat(document.getElementById('q1').value);
  var u2 = parseFloat(document.getElementById('q2').value);
  var roots = [u1, u2].sort(function(a,b){return a-b;});
  var ok = Math.abs(roots[0] - problem.roots[0]) < 0.01 && Math.abs(roots[1] - problem.roots[1]) < 0.01;
  var fb = document.getElementById('quadF');
  fb.textContent = ok ? 'Correct! +20 XP' : 'Not quite.';
  fb.className = 'feedback ' + (ok ? 'correct' : 'incorrect');
  if (ok) addXP(20); else streak = 0;
  updateStats();
}
function explainQuad() {
  var s = document.getElementById('quadS');
  s.style.display = 'block';
  s.textContent = 'Roots: ' + problem.roots[0] + ' and ' + problem.roots[1];
}

function newSys() {
  var x = 1 + Math.floor(Math.random() * 6);
  var y = 1 + Math.floor(Math.random() * 6);
  problem = {x: x, y: y};
  var el = document.getElementById('sysP');
  if (el) el.innerHTML = 'Solve: x + y = ' + (x+y) + ', 2x - y = ' + (2*x - y);
}
function checkSys() {
  var ux = parseFloat(document.getElementById('sx').value);
  var uy = parseFloat(document.getElementById('sy').value);
  var ok = Math.abs(ux - problem.x) < 0.01 && Math.abs(uy - problem.y) < 0.01;
  var fb = document.getElementById('sysF');
  fb.textContent = ok ? 'Correct! +25 XP' : 'Incorrect';
  fb.className = 'feedback ' + (ok ? 'correct' : 'incorrect');
  if (ok) addXP(25); else streak = 0;
  updateStats();
}
function explainSys() {
  document.getElementById('sysS').style.display = 'block';
  document.getElementById('sysS').textContent = 'x = ' + problem.x + ', y = ' + problem.y;
}

function newPoly() {
  var r1 = 1 + Math.floor(Math.random() * 5);
  var r2 = 1 + Math.floor(Math.random() * 5);
  problem = {roots: [r1, r2]};
  var el = document.getElementById('polyP');
  if (el) el.innerHTML = 'Factor: x² - ' + (r1+r2) + 'x + ' + (r1*r2);
}
function checkPoly() {
  var user = (document.getElementById('polyA').value || '').replace(/\s/g, '');
  var ok = user.indexOf(problem.roots[0]) !== -1 && user.indexOf(problem.roots[1]) !== -1;
  document.getElementById('polyF').textContent = ok ? 'Correct!' : 'Try again';
  document.getElementById('polyF').className = 'feedback ' + (ok ? 'correct' : 'incorrect');
  if (ok) addXP(15);
}
function explainPoly() {
  document.getElementById('polyS').style.display = 'block';
  document.getElementById('polyS').textContent = '(x-' + problem.roots[0] + ')(x-' + problem.roots[1] + ')';
}

function newExp() {
  problem = {ans: '8'};
  document.getElementById('expP').innerHTML = 'Simplify: √64';
}
function checkExp() {
  var ok = (document.getElementById('expA').value || '').indexOf('8') !== -1;
  document.getElementById('expF').textContent = ok ? 'Correct!' : 'Try again';
  if (ok) addXP(15);
}
function explainExp() {
  document.getElementById('expS').style.display = 'block';
  document.getElementById('expS').textContent = '√64 = 8';
}

function newRat() {
  problem = {simplified: 'x+2'};
  document.getElementById('ratP').innerHTML = 'Simplify: (x²-4)/(x-2)';
}
function checkRat() {
  var ok = (document.getElementById('ratA').value || '').indexOf('x+2') !== -1;
  document.getElementById('ratF').textContent = ok ? 'Correct!' : 'Factor and cancel';
  if (ok) addXP(15);
}
function explainRat() {
  document.getElementById('ratS').style.display = 'block';
  document.getElementById('ratS').textContent = '= x+2 (x≠2)';
}

function solveLin() {
  var a = +document.getElementById('ta').value;
  var b = +document.getElementById('tb').value;
  var c = +document.getElementById('tc').value;
  document.getElementById('tRes').textContent = a ? 'x = ' + ((c - b) / a).toFixed(3) : 'Invalid';
}

function addXP(n) {
  xp += n;
  streak++;
  level = 1 + Math.floor(xp / 100);
  updateStats();
}
function updateStats() {
  document.getElementById('xp').textContent = xp;
  document.getElementById('lvl').textContent = level;
  document.getElementById('streak').textContent = streak + ' 🔥';
}

go('dashboard');
</script>
</body>
</html>
