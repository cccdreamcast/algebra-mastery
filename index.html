<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Algebra Mastery — Fun, interactive algebra learning app covering linear equations, systems, quadratics, polynomials, exponents, and more. Practice with gamification, visual tools, and instant feedback.">
    <meta property="og:title" content="Algebra Mastery - Interactive Algebra Learning">
    <meta property="og:description" content="Master algebra the fun way. Interactive lessons, practice problems, solvers, and graphing tools.">
    <meta property="og:image" content="logo.jpg">
    <title>Algebra Mastery - Fun Interactive Learning</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.jpg" alt="Algebra Mastery" class="logo-img">
                <h1>Algebra<br>Mastery</h1>
                <p>Level up your algebra</p>
            </div>
            <div class="player-stats">
                <div class="stat">
                    <span class="stat-label">Level</span>
                    <span class="stat-value" id="playerLevel">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">XP</span>
                    <span class="stat-value" id="playerXP">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Streak</span>
                    <span class="stat-value" id="playerStreak">0 🔥</span>
                </div>
            </div>
            <nav id="nav">
                <button class="nav-btn active" data-section="dashboard">🏠 Dashboard</button>
                <button class="nav-btn" data-section="linear">⚖️ Linear Equations</button>
                <button class="nav-btn" data-section="systems">🔗 Systems</button>
                <button class="nav-btn" data-section="quadratic">📈 Quadratics</button>
                <button class="nav-btn" data-section="polynomials">🧩 Polynomials</button>
                <button class="nav-btn" data-section="exponents">⚡ Exponents</button>
                <button class="nav-btn" data-section="rational">➗ Rational</button>
                <button class="nav-btn" data-section="tools">🛠️ Tools</button>
                <button class="nav-btn" data-section="achievements">🏆 Achievements</button>
            </nav>
            <div class="progress-summary" id="progressSummary">
                <h3>Overall Progress</h3>
                <div class="progress-bar"><div id="progressFill" style="width: 0%"></div></div>
                <p id="progressText">0% Complete</p>
            </div>
        </aside>
        <main class="main" id="mainContent">
            <!-- Content loaded dynamically -->
        </main>
    </div>
    <div id="confetti-container"></div>
    <script src="app.js"></script>
</body>
</html>
